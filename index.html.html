body::before{content:"";position:fixed;inset:0;background:linear-gradient(#120d2499,#120d24cc);z-index:-1}
#app{max-width:520px;margin:0 auto;padding:18px 16px 32px}
.hero{position:relative;text-align:center;padding:26px 0 10px}
.dec{display:none;position:absolute;font-size:64px;opacity:.55;filter:drop-shadow(0 4px 10px #0008)}
.logo{position:relative;display:inline-block;transform:rotate(-3deg);padding:6px 10px}
.l1,.l2{font-weight:900;font-size:68px;line-height:.95;letter-spacing:-1px;text-shadow:0 4px 0 #1a0f00,0 8px 18px #000a}
.l1{color:#fff7e8}.l2{color:var(--or)}
.l1 span,.l2 span{color:var(--y1);font-size:.8em;vertical-align:top;margin-left:2px}
.rib{display:inline-block;margin-top:10px;padding:6px 22px;border-radius:12px;background:#17102b;border:2px solid #3a2c63;font-style:italic;font-weight:800;font-size:20px;color:var(--y1);box-shadow:0 6px 20px #000a}
.logoimg{display:block;width:100%;height:auto;margin:4px 0 -6px;-webkit-mask-image:radial-gradient(ellipse 71% 71% at 50% 50%,#000 78%,transparent 100%);mask-image:radial-gradient(ellipse 71% 71% at 50% 50%,#000 78%,transparent 100%)}
.cta,button.p{background:linear-gradient(var(--y1),var(--y2));color:var(--yt);font-weight:800;border:0;box-shadow:0 5px 0 #b86a00,0 10px 26px #ff9a1f55}
.cta{font-size:22px;padding:18px;margin:22px 0 8px}
.sec{font-size:20px;font-weight:800;margin:22px 2px 10px}
button{font:inherit;font-weight:700;width:100%;border-radius:18px;padding:14px;background:linear-gradient(#3f2a86,#2b1a5e);color:#fff;border:2px solid #9a82ff;box-shadow:0 4px 0 #120a2b;cursor:pointer}
button:active{transform:translateY(2px)}button:disabled{opacity:.4}
button.g{background:linear-gradient(var(--ok1),var(--ok2));color:#06240f;border:0;font-weight:800;box-shadow:0 5px 0 #17702d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;align-items:center;gap:10px;text-align:left;padding:16px 12px;background:linear-gradient(#3f2a86,#2b1a5e)}
.cat b{font-size:30px}.cat.sel,.sel{outline:2px solid var(--y1);background:linear-gradient(#6b4510,#43290a)!important;border-color:var(--y1)!important;color:var(--tx)!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0;backdrop-filter:blur(6px)}
h2{font-size:18px;margin:0 0 8px;font-weight:800}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
input{font:inherit;width:100%;padding:13px;border-radius:14px;border:2px solid #9a82ff;background:#150d30;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#3a2680;border:1px solid #9a82ff;border-radius:999px;padding:6px 12px}
.score{display:flex;justify-content:space-between;align-items:center;padding:9px 0}
.score:last-child{border:0}.cur{color:var(--y1);font-weight:800}
.bar{height:6px;border-radius:6px;background:#ffffff1a;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y2),var(--y1))}
.big{font-size:88px;font-weight:900;text-align:center;line-height:1;margin:6px 0;color:var(--y1);text-shadow:0 4px 0 #8a4a00,0 0 40px #ff9a1f88}
.note{background:#150d30;border:1px solid #9a82ff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}
.top{display:flex;align-items:center;gap:10px}.top button{width:auto;padding:8px 14px}
</style></head><body><div id="app"></div>
<script>
const HINT=2,WIN=30,CATS=[['🎬','Фильмы'],['📺','Сериалы'],['🎮','Игры'],['⭐','и другое']];
let st={view:'home',cat:0,mode:'team',names:[],scores:[],round:0,words:0,genre:false,decade:false,pick:false};
const pts=()=>Math.max(0,10-st.words-(st.genre?HINT:0)-(st.decade?HINT:0));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=()=>st.names.length;
const roles=()=>{const g=st.round%n();return st.mode==='team'?{h:(g+1)%n(),g}:{h:g,g:-1}};
function go(v){st.view=v;render()}
function cat(i){st.cat=i;render()}
function set(m){st.mode=m;st.names=[];render()}
function add(){const i=document.getElementById('nm');const v=i.value.trim();if(v)st.names.push(v);i.value='';render();document.getElementById('nm').focus()}
function del(i){st.names.splice(i,1);render()}
function start(){st.scores=st.names.map(()=>0);st.round=0;resetR();go('play')}
function resetR(){st.words=0;st.genre=false;st.decade=false;st.pick=false}
function word(){if(pts()>0){st.words++;render()}}
function hint(k){st[k]=true;render()}
function win(i){st.scores[i]+=pts();if(st.scores[i]>=WIN)go('end');else next()}
function guessed(){if(st.mode==='team')win(roles().g);else{st.pick=true;render()}}
function next(){st.round++;resetR();render()}
function again(){st={...st,view:'home',names:[],scores:[],round:0};resetR();render()}
function render(){
const a=document.getElementById('app'),T=st.mode==='team',C=CATS[st.cat];let h='';
if(st.view==='home'){
h=`<div style="text-align:center;padding:22px 0 4px"><div class="l1" style="font-size:46px">КИНО? <span style="color:var(--or);font-size:inherit;margin:0;vertical-align:baseline">ИГРА?</span></div><div class="rib" style="margin-top:8px;font-size:18px">— УГАДАЙ! —</div></div>
<button class="cta" onclick="go('setup')">▶ Начать игру</button>
<div class="sec">🏆 Категории</div><div class="grid">${CATS.map((c,i)=>`<button class="cat ${i===st.cat?'sel':''}" onclick="cat(${i})"><b>${c[0]}</b>${c[1]}</button>`).join('')}</div>
<div class="card" style="margin-top:18px"><h2>📜 Правила</h2><div class="mut">Играем до ${WIN} очков. Загаданное стоит 10 очков. ${T?'Каждый круг (каждый игрок загадывающей команды называет по слову): −1.':'Каждое слово: −1.'} Подсказки: −${HINT} за каждую. Очки получает тот, кто отгадал.${T?' В каждом круге каждый игрок отгадывающей команды может назвать только один вариант (фильм, сериал или игру). Например, если в команде двое, каждый называет по одному варианту, и на этом круг заканчивается.':''}</div></div>`;
}else if(st.view==='setup'){
h=`<div class="top"><button onclick="go('home')">‹ Назад</button><h2 style="margin:0">${C[0]} ${C[1]}</h2></div>
<div class="card"><h2>Режим</h2><div class="row"><button class="${T?'sel':''}" onclick="set('team')">👥 Командами</button><button class="${T?'':'sel'}" onclick="set('solo')">🙋 Каждый сам</button></div></div>
<div class="card"><h2>${T?'Команды':'Игроки'}</h2><div class="row"><input id="nm" placeholder="${T?'Название команды':'Имя игрока'}" onkeydown="if(event.key==='Enter')add()"><button style="flex:0 0 58px" onclick="add()">+</button></div>
<div class="chips">${st.names.map((x,i)=>`<span class="chip" onclick="del(${i})">${esc(x)} ✕</span>`).join('')||'<span class="mut">Добавь минимум двоих</span>'}</div></div>
<button class="p" style="font-size:20px;padding:16px" ${n()<2?'disabled':''} onclick="start()">▶ Поехали</button>`;
}else if(st.view==='play'){
const r=roles(),p=pts();
h=`<div class="card"><h2>🏆 Счёт</h2>${st.names.map((x,i)=>`<div><div class="score ${i===r.g?'cur':''}"><span>${esc(x)}${i===r.h?' 🎭':''}${i===r.g?' 🤔':''}</span><span>${st.scores[i]} / ${WIN}</span></div><div class="bar"><i style="width:${Math.min(100,st.scores[i]/WIN*100)}%"></i></div></div>`).join('')}</div>
<div class="card"><div class="mut" style="text-align:center">${C[0]} ${C[1]} · раунд ${st.round+1}<br>${T?`загадывает ${esc(st.names[r.h])}, отгадывает ${esc(st.names[r.g])}`:`загадывает ${esc(st.names[r.h])}, отгадывают все`}</div>
<div class="big">${p}</div><div class="mut" style="text-align:center">очков · ${T?'кругов':'слов'} сказано: ${st.words}</div>${T?'<div class="note" style="text-align:center">☝️ В каждом круге каждый отгадывающий называет только один вариант</div>':''}</div>`;
if(st.pick){
h+=`<div class="card"><h2>Кто отгадал?</h2>${st.names.map((x,i)=>i===r.h?'':`<div class="row"><button class="g" onclick="win(${i})">${esc(x)} (+${p})</button></div>`).join('')}<div class="row"><button onclick="st.pick=false;render()">Назад</button></div></div>`;
}else{
h+=`<div class="row"><button class="p" style="padding:16px" ${p===0?'disabled':''} onclick="word()">${T?'+ Круг: каждый по слову (−1)':'+ Слово (−1)'}</button></div>
<div class="row"><button ${st.genre||p<HINT?'disabled':''} onclick="hint('genre')">❓ Жанр/тема (−${HINT})</button><button ${st.decade||p<HINT?'disabled':''} onclick="hint('decade')">📅 Десятилетие (−${HINT})</button></div>
${st.genre?'<div class="note">❓ Отгадывающий задаёт один вопрос про жанр или тему, загадывающий отвечает.</div>':''}
${st.decade?'<div class="note">📅 Загадывающий называет десятилетие выхода.</div>':''}
<div class="row"><button class="g" onclick="guessed()">Отгадали ✓</button><button onclick="next()">Не отгадали</button></div>
<div class="row"><button onclick="go('end')">Завершить игру</button></div>`;
}
}else{
const o=st.names.map((x,i)=>[x,st.scores[i]]).sort((a,b)=>b[1]-a[1]);
h=`<div class="hero"><div style="font-size:84px">🏆</div><div class="l1" style="font-size:40px">ИТОГИ</div></div><div class="card">${o.map((x,i)=>`<div class="score ${i===0?'cur':''}"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(x[0])}</span><span>${x[1]}</span></div>`).join('')}</div><button class="p" style="padding:16px" onclick="again()">Новая игра</button>`;
}
a.innerHTML=h}
render();
</script></body></html>
